<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Life Expectancy and Infant Mortality by Race and Income</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #fff; color: #212529; }
        main { padding: 8px 12px; }
        h1 { font-size: 15px; color: #1a3a6c; text-align: center; margin-bottom: 6px; }
        #control { text-align: center; font-size: 13px; margin-bottom: 6px; }
        #control select { font-size: 13px; padding: 3px 6px; }
        #panels { display: flex; gap: 10px; }
        .panel { flex: 1; }
        .panel h2 { font-size: 13px; color: #495057; text-align: center; margin-bottom: 2px; }
        .chart-wrap { position: relative; width: 100%; height: 300px; }
        #source { font-size: 11px; color: #777; margin-top: 6px; text-align: right; }
    </style>
</head>
<body>
<main>
    <h1>Life Expectancy and Infant Mortality by Race and Income (US)</h1>
    <div id="control">
        View:
        <select id="view">
            <option value="race" selected>By Race / Ethnicity</option>
            <option value="income">By Income Quartile</option>
        </select>
    </div>
    <div id="panels">
        <div class="panel">
            <h2>Life Expectancy at Birth (years)</h2>
            <div class="chart-wrap"><canvas id="leChart"></canvas></div>
        </div>
        <div class="panel">
            <h2>Infant Mortality Rate (per 1,000 live births)</h2>
            <div class="chart-wrap"><canvas id="imChart"></canvas></div>
        </div>
    </div>
    <div id="source">Source: CDC WONDER and NCHS, approximate published values, 2000–2021.</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="health-disparities-bar-chart.js"></script>
</body>
</html>
