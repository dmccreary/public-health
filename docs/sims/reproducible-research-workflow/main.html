<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Reproducible Research Workflow</title>
    <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #fff; color: #212529; }
        main { padding: 8px 12px; }
        h1 { font-size: 16px; color: #1a3a6c; text-align: center; margin-bottom: 4px; }
        #row { display: flex; gap: 10px; }
        #net { flex: 0 0 62%; height: 460px; border: 1px solid #dee2e6; border-radius: 4px; }
        #panel { flex: 1; padding: 10px; font-size: 12.5px; line-height: 1.45;
                 background: #f4f7fb; border-radius: 4px; border-left: 4px solid #1a3a6c;
                 max-height: 460px; overflow-y: auto; }
        #panel h3 { font-size: 13.5px; color: #1a3a6c; margin-bottom: 4px; }
        #legend { display: flex; gap: 14px; font-size: 11.5px; margin-top: 6px; color: #555; }
        #legend span.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: middle; margin-right: 3px; }
    </style>
</head>
<body>
<main>
    <h1>Reproducible Research Workflow (Git-based pipeline)</h1>
    <div id="row">
        <div id="net"></div>
        <div id="panel">
            <h3>Click any stage.</h3>
            <p>Each node is a step in a fully reproducible data-to-paper
            pipeline. Click to see what the stage produces and what makes
            it reproducible.</p>
        </div>
    </div>
    <div id="legend">
        <span><span class="swatch" style="background:#9e9e9e"></span>Input</span>
        <span><span class="swatch" style="background:#2196F3"></span>Processing</span>
        <span><span class="swatch" style="background:#4CAF50"></span>Output</span>
        <span><span class="swatch" style="background:#FF9800"></span>Version control</span>
    </div>
</main>
<script src="reproducible-research-workflow.js"></script>
</body>
</html>
