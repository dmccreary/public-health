<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Global Burden of Disease by Cause and Income Group</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #fff; color: #212529; }
        main { padding: 6px 12px 8px; }
        h1 { font-size: 15px; color: #1a3a6c; text-align: center; margin-bottom: 4px; }
        #controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            margin-bottom: 6px;
            padding: 4px;
            background: #f5f7fa;
            border-radius: 4px;
        }
        #controls label { font-weight: 600; color: #333; }
        #controls select { font-size: 12px; padding: 2px 4px; }
        #controls .radio-group { display: inline-flex; gap: 8px; align-items: center; }
        #controls .radio-group label { font-weight: 400; cursor: pointer; }
        .chart-wrap { position: relative; width: 100%; height: 360px; }
        #interpretation {
            margin-top: 6px;
            padding: 6px 10px;
            background: #f0f6ff;
            border-left: 3px solid #1a3a6c;
            font-size: 12px;
            min-height: 32px;
            color: #1a3a6c;
        }
        #source { font-size: 11px; color: #777; margin-top: 4px; text-align: right; }
    </style>
</head>
<body>
<main>
    <h1>Global Burden of Disease by Cause and Income Group</h1>
    <div id="controls">
        <label>Metric:
            <select id="metric">
                <option value="absolute" selected>Absolute DALYs (millions)</option>
                <option value="rate">Age-standardized DALYs per 100,000</option>
            </select>
        </label>
        <span class="radio-group">
            <label>Group by:</label>
            <label><input type="radio" name="grouping" value="income" checked> Income</label>
            <label><input type="radio" name="grouping" value="region"> WHO Region</label>
        </span>
        <label><input type="checkbox" id="avgline" checked> Global average</label>
    </div>
    <div class="chart-wrap"><canvas id="gbdChart"></canvas></div>
    <div id="interpretation">Hover any bar to see details and an interpretation.</div>
    <div id="source">Source: IHME Global Burden of Disease 2021 (illustrative estimates)</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
<script src="gbd-burden-chart.js"></script>
</body>
</html>
